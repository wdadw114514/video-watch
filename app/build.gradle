apply plugin: 'com.android.application'

android {
    namespace 'com.example.videowatch'
    compileSdk 33

    defaultConfig {
        applicationId "com.example.videowatch"
        minSdk 19
        targetSdk 19
        versionCode 2
        versionName "1.2"
    }

    signingConfigs {
        release {
            storeFile file("subway.jks")
            storePassword "subway123"
            keyAlias "subway"
            keyPassword "subway123"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.release
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
